<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e3e6ea; --line2: #eef1f4;
    --text: #1f2328; --dim: #5f6b7a; --accent: #01875f; --gold: #9a6700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }

  header { padding: 16px 20px 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em;
              display: inline; }
  header .stats { display: inline; margin-left: 12px; font-size: 12px; color: var(--dim); }
  header .stats b { color: var(--text); font-weight: 600; }
  header .home { float: right; font-size: 12px; text-decoration: none;
                 color: var(--dim); }
  header .home:hover { color: var(--accent); }

  nav { position: sticky; top: 0; z-index: 10; padding: 8px 20px;
        background: rgba(244,245,247,.95); backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  nav input[type=search] { flex: 1 1 150px; min-width: 110px; padding: 5px 10px;
              background: var(--panel); border: 1px solid var(--line);
              border-radius: 7px; color: var(--text); font-size: 12.5px; outline: none; }
  nav input[type=search]:focus { border-color: var(--accent); }
  .chip { padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
          background: var(--panel); border: 1px solid var(--line);
          color: var(--dim); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent);
                 color: #fff; font-weight: 600; }
  .chip.active b { color: #d8f3e8; }
  .chip b { color: var(--accent); font-weight: 600; margin-left: 3px; }
  .toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
            color: var(--dim); cursor: pointer; user-select: none; white-space: nowrap;
            padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
            background: var(--panel); }
  .toggle:has(input:checked) { background: var(--accent); border-color: var(--accent);
                               color: #fff; font-weight: 600; }
  .toggle input { accent-color: var(--accent); margin: 0; }

  /* masonry-style column flow: panels pack tight, no dead vertical space */
  main { max-width: 1600px; margin: 0 auto; padding: 10px 20px 50px;
         columns: 4 300px; column-gap: 10px; }

  .panel { break-inside: avoid; background: var(--panel);
           border: 1px solid var(--line); border-radius: 9px;
           padding: 9px 10px; margin: 0 0 10px;
           box-shadow: 0 1px 2px rgba(31,35,40,.04); }
  .panel h3 { font-size: 11px; font-weight: 700; color: var(--accent);
              margin: 0; letter-spacing: .05em; text-transform: uppercase; }
  .panel .catlab { color: var(--dim); font-size: 10px; font-weight: 400;
                   letter-spacing: .03em; text-transform: none; }
  .subreview { font-size: 11px; color: var(--dim); font-style: italic; margin: 4px 0 0; }

  .items { display: grid; gap: 2px; margin-top: 6px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 3px 5px;
          border-radius: 6px; text-decoration: none; color: var(--text);
          min-width: 0; }
  .item:hover { background: var(--line2); }
  .item .ic { width: 24px; height: 24px; border-radius: 6px; flex: none;
              background-repeat: no-repeat; }
  .item .body { min-width: 0; display: flex; align-items: baseline; gap: 6px; flex: 1; }
  .item .name { font-weight: 600; font-size: 11.5px; line-height: 1.2;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .dev { color: var(--dim); font-size: 9.5px; line-height: 1.2;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 9px; padding: 0 4px; border-radius: 999px; flex: none;
           border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .badge.gone { color: #969ca5; border-color: var(--line2); }
  .item.dead { opacity: .5; }
  .item.dead:hover { opacity: .9; }
  .item .review { display: block; font-size: 10.5px; color: var(--dim);
                  line-height: 1.35; padding: 1px 0 2px 32px; }

  details.syspan { column-span: all; margin: 4px 0 10px;
                   background: var(--panel); border: 1px solid var(--line);
                   border-radius: 9px; padding: 9px 10px; }
  details.syspan summary { cursor: pointer; list-style: none; display: flex;
                           align-items: center; gap: 8px; }
  details.syspan summary::-webkit-details-marker { display: none; }
  details.syspan summary::before { content: "▸"; color: var(--dim);
                                   transition: transform .15s; }
  details.syspan[open] summary::before { transform: rotate(90deg); }
  details.syspan summary h2 { font-size: 13px; font-weight: 700; margin: 0; }
  details.syspan summary .count { color: var(--dim); font-weight: 400;
                                  font-size: 11px; margin-left: 6px; }
  details.syspan summary .hint { color: var(--dim); font-size: 11px; }
  details.syspan .inner { columns: 4 280px; column-gap: 10px; margin-top: 8px; }

  .widepan { column-span: all; }

  table.spend { border-collapse: collapse; font-size: 12px; }
  table.spend th, table.spend td { text-align: left; padding: 3px 16px 3px 0;
                                   border-bottom: 1px solid var(--line2); }
  table.spend th { color: var(--dim); font-weight: 600; font-size: 10.5px;
                   text-transform: uppercase; letter-spacing: .04em; }
  table.spend td:last-child, table.spend th:last-child { padding-right: 0;
                   text-align: right; font-variant-numeric: tabular-nums; }
  .spendwrap { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 8px; }
  .spendwrap h4 { margin: 0 0 5px; font-size: 11px; color: var(--dim);
                  text-transform: uppercase; letter-spacing: .04em; }

  .hidden { display: none !important; }
  footer { padding: 18px 20px 32px; text-align: center; color: var(--dim); font-size: 11.5px; }

  @media (max-width: 640px) {
    header { padding: 14px 14px 8px; }
    main { padding: 8px 10px 44px; columns: 1; }
    nav { padding: 6px 10px; }
  }
</style>
</head>

nt", "Rhythm & music", "Shooting & action", "Arcade & casual", "Console companions", "PC companions", "Collection trackers"], "music": ["Players", "Streaming", "Guitar", "Other instruments", "Ear & practice", "Reading & theory", "Making noise"], "podcasts": ["Main players", "More catchers", "Radio & live"], "reading": ["Books & ebooks", "Comics", "Audiobooks & read-aloud"], "media": ["Streaming", "Players & casting"], "language": ["Japanese & Chinese", "General courses", "More languages", "Sign language", "Grammar & translation"], "learning": ["Courses", "Field guides & reference"], "art": ["Drawing", "Doodles & pixels", "Graffiti", "Photo editors", "Photos & effects", "Stock & portfolio"], "social": ["Chat", "Meta & legacy chat", "Feeds", "More social", "Social tools"], "news": ["Good news only", "Readers & feeds", "Papers & newsletters"], "health": ["Mind & sleep", "Body & services"], "travel": ["Trains & transit", "Maps & navigation", "Trips & stays", "Weather"], "money": ["Banks & payments", "Shopping", "Deals & second-hand", "Crypto & investing"], "tools": ["Notes", "Lists & calendars", "Docs & mail", "Editors & files", "Security & identity", "Files & cleaning", "Scan & documents", "Measure & record", "Remote access", "Calls & SMS", "Web & work"], "gadgets": ["Remotes", "Home & hubs", "Wearables & personal"], "system": ["Google services", "Android features", "Google built-ins", "Keyboards & launchers", "Wallpapers & themes", "Root & system tools", "Samsung apps", "Samsung services", "ColorOS system", "ColorOS apps", "Sony & legacy OEM"]}, "sprite": {"file": "sprite.jpg", "cols": 25, "cell": 128}, "counts": {"total": 605, "purchased": 159, "dead": 104}};
const REVS = (typeof REVIEWS !== 'undefined') ? REVIEWS : {};

const main = document.getElementById('main');
const nav = document.getElementById('nav');
const q = document.getElementById('q');
const paidonly = document.getElementById('paidonly');
const showdead = document.getElementById('showdead');

const money = s => s ? parseFloat(s.replace(/[^\d.]/g, '')) : 0;
const yearOf = d => { const m = d && d.match(/\b(19|20)\d{2}\b/); return m ? +m[0] : null; };
const fmt = n => '£' + n.toFixed(2);

document.getElementById('stats').innerHTML =
  ` — <b>${META.counts.total}</b> apps · <b>${META.counts.purchased}</b> purchased · ` +
  `<b>${META.counts.dead}</b> gone from the Play Store`;

function spendOf(rows) {
  let n = 0, t = 0;
  for (const r of rows) { const p = money(r.price); if (p) { n++; t += p; } }
  return {n, t};
}
function spendTip(label, rows) {
  const s = spendOf(rows);
  if (!s.n) return label;
  return `${label} — ${s.n} bought, ${fmt(s.t)} total`;
}

const byCat = {};
for (const a of APPS) (byCat[a.cat] ??= []).push(a);
for (const k in byCat)
  byCat[k].sort((x, y) => x.name.localeCompare(y.name, 'en', {sensitivity:'base'}));

function item(r) {
  const el = document.createElement('a');
  el.className = 'item' + (r.dead ? ' dead' : '');
  el.href = r.url; el.target = '_blank'; el.rel = 'noopener';
  el.dataset.search = (r.name + ' ' + r.dev + ' ' + r.pkg + ' ' + r.sub).toLowerCase();
  el.dataset.paid = money(r.price) > 0 ? '1' : '';
  el.title = r.price ? `${r.name} — ${r.price} · ${r.date}` : r.name;
  const ic = document.createElement('span');
  ic.className = 'ic';
  ic.style.backgroundImage = `url(${META.sprite.file})`;
  ic.style.backgroundSize = `${META.sprite.cols * 24}px auto`;
  ic.style.backgroundPosition = `-${r.sp[0] * 24}px -${r.sp[1] * 24}px`;
  el.appendChild(ic);
  const body = document.createElement('div');
  body.className = 'body';
  const name = document.createElement('div');
  name.className = 'name'; name.textContent = r.name;
  body.appendChild(name);
  if (r.dev) {
    const dev = document.createElement('div');
    dev.className = 'dev'; dev.textContent = r.dev;
    body.appendChild(dev);
  }
  if (r.dead) {
    const b = document.createElement('span');
    b.className = 'badge gone'; b.textContent = 'gone';
    body.appendChild(b);
  }
  el.appendChild(body);
  const review = REVS[r.pkg];
  if (review) {
    const w = document.createElement('span');
    const d = document.createElement('span');
    d.className = 'review'; d.textContent = review;
    w.appendChild(el); w.appendChild(d);
    return w;
  }
  return el;
}

function panel(label, catLabel, rows, anchorId, catKey) {
  const p = document.createElement('div');
  p.className = 'panel';
  p.dataset.cat = catKey;
  if (anchorId) p.id = anchorId;
  const h = document.createElement('h3');
  h.innerHTML = label +
    ` <span class="catlab">${catLabel} · ${rows.length}</span>`;
  h.title = spendTip(label, rows);
  p.appendChild(h);
  const srev = REVS['sub:' + label];
  if (srev) {
    const d = document.createElement('div');
    d.className = 'subreview'; d.textContent = srev;
    p.appendChild(d);
  }
  const g = document.createElement('div');
  g.className = 'items';
  for (const r of rows) g.appendChild(item(r));
  p.appendChild(g);
  return p;
}

const chipTargets = {};
const sysPanels = [];

for (const c of META.cats) {
  const rows = byCat[c.key];
  if (!rows || !rows.length) continue;
  const order = (META.subOrder[c.key] || []);
  const subs = [...new Set(rows.map(r => r.sub).filter(Boolean))];
  subs.sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  const units = [];
  const loose = rows.filter(r => !r.sub);
  if (loose.length) units.push([c.label, loose]);
  for (const s of subs) units.push([s, rows.filter(r => r.sub === s)]);

  units.forEach(([label, urows], i) => {
    const anchor = i === 0 ? 'cat-' + c.key : null;
    const p = panel(label, c.label, urows, anchor, c.key);
    if (c.collapsed) sysPanels.push(p); else main.appendChild(p);
  });
  chipTargets[c.key] = {label: c.label, count: rows.length};
}

// collapsed OEM/system panel, spanning all columns
if (sysPanels.length) {
  const det = document.createElement('details');
  det.className = 'syspan'; det.id = 'cat-system';
  const total = sysPanels.reduce((n, p) =>
    n + p.querySelectorAll('.item').length, 0);
  det.innerHTML = `<summary><h2>System &amp; Bundled<span class="count">${total}</span></h2>` +
    `<span class="hint">— OEM bloat, kept for the record</span></summary>`;
  const inner = document.createElement('div');
  inner.className = 'inner';
  for (const p of sysPanels) inner.appendChild(p);
  det.appendChild(inner);
  main.appendChild(det);
}

// spend panel, full column span
{
  const paid = APPS.filter(r => money(r.price) > 0);
  const tot = paid.reduce((s, r) => s + money(r.price), 0);
  const byYear = {}, byCatSpend = {};
  for (const r of paid) {
    const y = yearOf(r.date) || 'unknown';
    (byYear[y] ??= {n: 0, t: 0}).n++; byYear[y].t += money(r.price);
    const cat = META.cats.find(c => c.key === r.cat);
    const cl = cat ? cat.label : r.cat;
    (byCatSpend[cl] ??= {n: 0, t: 0}).n++; byCatSpend[cl].t += money(r.price);
  }

  const sec = document.createElement('div');
  sec.className = 'panel widepan'; sec.id = 'cat-spend'; sec.dataset.cat = 'spend';
  const h = document.createElement('h3');
  h.innerHTML = `Spend <span class="catlab">${paid.length} items · ${fmt(tot)} total</span>`;
  sec.appendChild(h);

  const wrap = document.createElement('div');
  wrap.className = 'spendwrap';
  const mkTable = (title, entries, keyName) => {
    const d = document.createElement('div');
    const h4 = document.createElement('h4'); h4.textContent = title; d.appendChild(h4);
    const t = document.createElement('table'); t.className = 'spend';
    t.innerHTML = `<tr><th>${keyName}</th><th>Items</th><th>Spent</th></tr>`;
    for (const [k, v] of entries) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${k}</td><td>${v.n}</td><td>${fmt(v.t)}</td>`;
      tr.title = `${v.n} item${v.n === 1 ? '' : 's'} · ${fmt(v.t)}`;
      t.appendChild(tr);
    }
    d.appendChild(t);
    return d;
  };
  wrap.appendChild(mkTable('By year',
    Object.entries(byYear).sort((a, b) => ('' + a[0]).localeCompare('' + b[0])), 'Year'));
  wrap.appendChild(mkTable('By category',
    Object.entries(byCatSpend).sort((a, b) => b[1].t - a[1].t), 'Category'));
  sec.appendChild(wrap);
  main.appendChild(sec);
}

{
  const chip = document.createElement('a');
  chip.className = 'chip'; chip.href = '#';
  chip.textContent = 'All'; chip.dataset.cat = '';
  nav.appendChild(chip);
}
for (const [key, s] of Object.entries(chipTargets)) {
  const chip = document.createElement('a');
  chip.className = 'chip'; chip.href = '#';
  chip.innerHTML = `${s.label}<b>${s.count}</b>`;
  chip.dataset.cat = key;
  nav.appendChild(chip);
}
{
  const chip = document.createElement('a');
  chip.className = 'chip'; chip.href = '#';
  chip.innerHTML = `Spend`;
  chip.dataset.cat = 'spend';
  nav.appendChild(chip);
}

let catFilter = '';
nav.addEventListener('click', e => {
  const ch = e.target.closest('.chip');
  if (!ch || ch.dataset.cat === undefined) return;
  e.preventDefault();
  catFilter = (catFilter === ch.dataset.cat) ? '' : ch.dataset.cat;
  applyFilters();
  if (catFilter === 'system') document.querySelector('details.syspan').open = true;
  if (catFilter) window.scrollTo(0, 0);
});

function applyFilters() {
  const needle = q.value.trim().toLowerCase();
  const paid = paidonly.checked;
  const dead = !showdead.checked;
  document.querySelectorAll('.item').forEach(c => {
    const hide = (dead && c.classList.contains('dead')) ||
                 (paid && !c.dataset.paid) ||
                 (needle && !c.dataset.search.includes(needle));
    c.classList.toggle('hidden', !!hide);
  });
  document.querySelectorAll('.panel').forEach(p => {
    if (p.id === 'cat-spend') {
      p.classList.toggle('hidden', !!catFilter && catFilter !== 'spend');
      return;
    }
    const matchCat = !catFilter || p.dataset.cat === catFilter;
    const v = p.querySelectorAll('.item:not(.hidden)').length;
    p.classList.toggle('hidden', !matchCat || !v);
  });
  const det = document.querySelector('details.syspan');
  if (det) {
    const sysHas = [...det.querySelectorAll('.item')]
      .some(i => !i.classList.contains('hidden'));
    det.classList.toggle('hidden',
      (catFilter && catFilter !== 'system') || !sysHas);
    if (!det.classList.contains('hidden') && (needle || catFilter === 'system'))
      det.open = true;
  }
  document.querySelectorAll('.chip').forEach(ch => {
    ch.classList.toggle('active', ch.dataset.cat === catFilter);
    if (ch.dataset.cat === 'system') {
      ch.classList.toggle('hidden',
        !catFilter && (dead || paid || needle) && det &&
        ![...det.querySelectorAll('.item')].some(i => !i.classList.contains('hidden')));
    } else if (ch.dataset.cat === '' || ch.dataset.cat === 'spend') {
      ch.classList.remove('hidden');
    } else {
      const anyVisible = [...document.querySelectorAll(`.panel[data-cat="${ch.dataset.cat}"]`)]
        .some(p => p.querySelectorAll('.item:not(.hidden)').length);
      ch.classList.toggle('hidden',
        !catFilter && (dead || paid || needle) && !anyVisible);
    }
  });
}
q.addEventListener('input', applyFilters);
paidonly.addEventListener('change', applyFilters);
showdead.addEventListener('change', applyFilters);
applyFilters();
