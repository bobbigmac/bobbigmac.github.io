<!doctype html>
<meta charset="utf-8">
<title>search · my-links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<header class="pagehead">
  <div class="eyebrow">my-links</div>
  <h1>search</h1>
  <div class="mono">
    <a href="index.html">← index</a>
  </div>
  <input class="f gs" id="gs" placeholder="search links + videos…" autofocus>
</header>
<div id="srch"></div>
<script src="assets/search/lunr.min.js"></script>
<script src="assets/search.js"></script>
<script>searchInit('#gs','#srch',null,400,200)</script>
<script>
let active=null;
document.addEventListener('click',e=>{
const c=e.target.closest('[data-t]');
if(!c)return;
e.preventDefault();
active=(active===c.dataset.t)?null:c.dataset.t;
document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.t===active));
filter();});
function filter(){const q=(document.getElementById('q')||{value:''}).value.toLowerCase();
let shown=0;
document.querySelectorAll('ul.items li').forEach(li=>{
const okT=!active||li.dataset.tags.split(' ').includes(active);
const okQ=!q||li.textContent.toLowerCase().includes(q);
const vis=okT&&okQ;
li.classList.toggle('hidden',!vis);
if(vis)shown++;});
const n=document.getElementById('count');if(n)n.textContent=shown;
document.querySelectorAll('h2.year').forEach(h=>{
let n2=h.nextElementSibling,any=false;
while(n2&&n2.tagName==='UL'){if(n2.querySelector('li:not(.hidden)'))any=true;n2=n2.nextElementSibling;}
h.classList.toggle('hidden',!any);});}
</script>
